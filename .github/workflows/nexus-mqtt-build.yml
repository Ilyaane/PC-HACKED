name: Build NEXUS MQTT Cardputer ADV
on:
  push:
    branches:
      - nexus-mqtt-standalone-20261103
    paths:
      - 'nexus-mqtt/**'
      - '.github/workflows/nexus-mqtt-build.yml'
  pull_request:
    paths:
      - 'nexus-mqtt/**'
      - '.github/workflows/nexus-mqtt-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Extract versioned standalone source
        run: |
          mkdir -p /tmp/nexus-mqtt-build
          base64 -d nexus-mqtt/firmware_source.tar.gz.b64 | tar -xz -C /tmp/nexus-mqtt-build
          test -s /tmp/nexus-mqtt-build/firmware/src/main.cpp
      - name: Compile Cardputer ADV
        working-directory: /tmp/nexus-mqtt-build/firmware
        run: pio run -e cardputer-adv
      - name: Verify and stage firmware binary
        run: |
          mkdir -p dist
          test -s /tmp/nexus-mqtt-build/firmware/.pio/build/cardputer-adv/firmware.bin
          cp /tmp/nexus-mqtt-build/firmware/.pio/build/cardputer-adv/firmware.bin dist/NEXUS_MQTT_ADV_LAUNCHER_V0_2.bin
          sha256sum dist/*.bin > dist/SHA256SUMS.txt
          ls -alh dist
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-mqtt-cardputer-adv-v02
          path: dist/
          if-no-files-found: error
