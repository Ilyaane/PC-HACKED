name: NEXUS Cardputer ADV - compile and test
on:
  workflow_dispatch:
  push:
    branches: [nexus-adv-build, nexus-neon-stabilisation-20261110, nexus-display-ux-fix-20261110]
    paths: ['nexus-adv/**', '.github/workflows/nexus-adv-build.yml']
  pull_request:
    paths: ['nexus-adv/**', '.github/workflows/nexus-adv-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server tests
        run: node --test nexus-adv/cloudflare/tests/worker.test.mjs
      - name: Source static checks
        run: python nexus-adv/tests/static_checks.py
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Compile ADV
        working-directory: nexus-adv/firmware
        run: pio run -e cardputer-adv
      - name: Verify ESP32 image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nexus-adv/firmware/.pio/build/cardputer-adv/firmware.bin')
          data=p.read_bytes()
          assert len(data)>10000 and len(data)<=3342336, len(data)
          assert data[0]==0xE9, 'bad ESP32 image magic'
          print('Verified image header, size:',len(data))
          PY
      - name: Create standalone factory-flash image
        run: |
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            -o nexus-adv/firmware/.pio/build/cardputer-adv/NEXUS_ADV_full_flash_0x0.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB \
            0x0 nexus-adv/firmware/.pio/build/cardputer-adv/bootloader.bin \
            0x8000 nexus-adv/firmware/.pio/build/cardputer-adv/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 nexus-adv/firmware/.pio/build/cardputer-adv/firmware.bin
          python - <<'PY'
          from pathlib import Path
          p=Path('nexus-adv/firmware/.pio/build/cardputer-adv/NEXUS_ADV_full_flash_0x0.bin')
          b=p.read_bytes()
          assert b[0]==0xE9 and len(b)>1_000_000 and len(b)<=8*1024*1024
          print('Standalone flash image:', len(b), 'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Cardputer-ADV-unverified-on-device
          path: |
            nexus-adv/firmware/.pio/build/cardputer-adv/firmware.bin
            nexus-adv/firmware/.pio/build/cardputer-adv/NEXUS_ADV_full_flash_0x0.bin
          if-no-files-found: error
          retention-days: 14