name: NEXUS Cardputer ADV - compile and test
on:
  workflow_dispatch:
  push:
    branches: [nexus-adv-build]
    paths: ['nexus-adv/**', '.github/workflows/nexus-adv-build.yml']
  pull_request:
    paths: ['nexus-adv/**', '.github/workflows/nexus-adv-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server tests
        run: node --test nexus-adv/cloudflare/tests/worker.test.mjs
      - name: Source static checks
        run: python nexus-adv/tests/static_checks.py
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Compile ADV
        working-directory: nexus-adv/firmware
        run: pio run -e cardputer-adv
      - name: Verify ESP32 image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nexus-adv/firmware/.pio/build/cardputer-adv/firmware.bin')
          data=p.read_bytes()
          assert len(data)>10000 and len(data)<=3342336, len(data)
          assert data[0]==0xE9, 'bad ESP32 image magic'
          print('Verified image header, size:',len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Cardputer-ADV-unverified-on-device
          path: nexus-adv/firmware/.pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
          retention-days: 14